<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PM2.5 Health Monitor</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family: Arial;
margin:0;
text-align:center;
color:white;
transition:background 0.5s;
}

.container{
padding:20px;
max-width:900px;
margin:auto;
}

h1{
font-size:32px;
}

.pm{
font-size:70px;
font-weight:bold;
margin:20px;
}

.level{
font-size:24px;
}

.advice{
background:rgba(0,0,0,0.3);
padding:15px;
border-radius:10px;
margin-top:20px;
}

.location{
font-size:18px;
margin-top:10px;
}

canvas{
margin-top:30px;
background:white;
border-radius:10px;
}

@media(max-width:600px){

.pm{
font-size:50px;
}

}

</style>

</head>

<body>

<div class="container">

<h1>🌫 ระบบติดตามค่าฝุ่น PM2.5</h1>

<div id="location">กำลังค้นหาตำแหน่ง...</div>

<div class="pm" id="pm">--</div>

<div class="level" id="level">กำลังโหลดข้อมูล</div>

<div class="advice" id="advice"></div>

<canvas id="chart"></canvas>

</div>

<script>

const token="28d1b5b3fd38de7d3c494d2580af5790b51bf4a3";

let history=[];

function getLocation(){

navigator.geolocation.getCurrentPosition(success,error);

}

function success(position){

let lat=position.coords.latitude;
let lon=position.coords.longitude;

getCity(lat,lon);

getPM(lat,lon);

}

function error(){

document.getElementById("location").innerHTML="ไม่สามารถเข้าถึงตำแหน่งได้";

}

async function getCity(lat,lon){

let url=`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`;

let res=await fetch(url);

let data=await res.json();

document.getElementById("location").innerHTML=
"📍 "+data.address.city||data.address.town||data.address.village;

}

async function getPM(lat,lon){

let url=`https://api.waqi.info/feed/geo:${lat};${lon}/?token=${token}`;

let res=await fetch(url);

let data=await res.json();

let pm=data.data.iaqi.pm25.v;

showData(pm);

}

function showData(pm){

document.getElementById("pm").innerHTML=pm;

history.push(pm);

if(history.length>10){

history.shift();

}

updateChart();

let level="";
let advice="";
let color="";

if(pm<=25){

level="อากาศดี";
color="#2ecc71";
advice="สามารถทำกิจกรรมกลางแจ้งได้ตามปกติ";

}

else if(pm<=50){

level="ปานกลาง";
color="#f1c40f";
advice="กลุ่มเสี่ยงควรลดกิจกรรมกลางแจ้ง";

}

else if(pm<=100){

level="เริ่มมีผลกระทบ";

color="#e67e22";

advice="ควรสวมหน้ากาก N95";

notify("ค่าฝุ่นเริ่มมีผลกระทบต่อสุขภาพ");

}

else if(pm<=200){

level="มีผลกระทบต่อสุขภาพ";

color="#e74c3c";

advice="หลีกเลี่ยงกิจกรรมกลางแจ้ง";

notify("ค่าฝุ่นอันตราย");

}

else{

level="อันตรายมาก";

color="#8e44ad";

advice="ควรอยู่ในอาคารและใช้เครื่องฟอกอากาศ";

notify("ค่าฝุ่นอันตรายมาก");

}

document.body.style.background=color;

document.getElementById("level").innerHTML=level;

document.getElementById("advice").innerHTML=advice;

}

function notify(message){

if(Notification.permission==="granted"){

new Notification("แจ้งเตือน PM2.5",{body:message});

}

else if(Notification.permission!=="denied"){

Notification.requestPermission();

}

}

let chart;

function updateChart(){

let ctx=document.getElementById("chart");

if(chart) chart.destroy();

chart=new Chart(ctx,{

type:"line",

data:{

labels:history.map((_,i)=>i+1),

datasets:[{

label:"PM2.5",

data:history,

borderColor:"red",

fill:false

}]

}

});

}

getLocation();

setInterval(getLocation,600000);

</script>

</body>

</html>
