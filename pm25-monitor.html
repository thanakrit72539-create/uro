<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM2.5 Monitor</title>

<style>

body{
font-family: Arial, sans-serif;
margin:0;
padding:0;
text-align:center;
color:white;
transition: background 0.5s;
}

.container{
padding:30px;
}

h1{
font-size:32px;
}

.pm{
font-size:70px;
font-weight:bold;
margin:20px 0;
}

.level{
font-size:24px;
}

.advice{
margin-top:20px;
font-size:18px;
background:rgba(0,0,0,0.3);
padding:15px;
border-radius:10px;
}

.location{
margin-top:10px;
font-size:16px;
}

@media(max-width:600px){

.pm{
font-size:50px;
}

h1{
font-size:24px;
}

}

</style>

</head>

<body>

<div class="container">

<h1>🌫 รายงานค่าฝุ่น PM2.5</h1>

<div class="location" id="location">
กำลังค้นหาตำแหน่ง...
</div>

<div class="pm" id="pm">
--
</div>

<div class="level" id="level">
กำลังโหลดข้อมูล...
</div>

<div class="advice" id="advice"></div>

</div>


<script>

const token="28d1b5b3fd38de7d3c494d2580af5790b51bf4a3";

function getLocation(){

navigator.geolocation.getCurrentPosition(success,error);

}

function success(position){

let lat=position.coords.latitude;
let lon=position.coords.longitude;

document.getElementById("location").innerHTML=
"พิกัด: "+lat.toFixed(3)+" , "+lon.toFixed(3);

getPM(lat,lon);

}

function error(){
document.getElementById("location").innerHTML="ไม่สามารถระบุตำแหน่งได้";
}


function getPM(lat,lon){

let url=`https://api.waqi.info/feed/geo:${lat};${lon}/?token=${token}`;

fetch(url)
.then(res=>res.json())
.then(data=>{

let pm=data.data.iaqi.pm25.v;

showData(pm);

})

}


function showData(pm){

document.getElementById("pm").innerHTML=pm;

let level="";
let advice="";
let color="";

if(pm<=25){

level="คุณภาพอากาศดี";
color="#2ecc71";
advice="ประชาชนทั่วไปสามารถทำกิจกรรมกลางแจ้งได้ตามปกติ";

}

else if(pm<=50){

level="ปานกลาง";
color="#f1c40f";
advice="กลุ่มเสี่ยงควรลดกิจกรรมกลางแจ้ง";

}

else if(pm<=100){

level="เริ่มมีผลกระทบต่อสุขภาพ";
color="#e67e22";
advice="ควรสวมหน้ากาก N95 และลดเวลาทำกิจกรรมกลางแจ้ง";

notify("ค่าฝุ่นเริ่มมีผลต่อสุขภาพ");

}

else if(pm<=200){

level="มีผลกระทบต่อสุขภาพ";
color="#e74c3c";
advice="หลีกเลี่ยงกิจกรรมกลางแจ้ง และสวมหน้ากาก N95";

notify("ค่าฝุ่นอันตราย!");

}

else{

level="อันตรายมาก";
color="#8e44ad";
advice="ควรอยู่ภายในอาคารและใช้เครื่องฟอกอากาศ";

notify("ค่าฝุ่นอันตรายมาก!");

}

document.body.style.background=color;

document.getElementById("level").innerHTML=level;
document.getElementById("advice").innerHTML=advice;

}


function notify(msg){

if(Notification.permission==="granted"){

new Notification("แจ้งเตือน PM2.5",{
body:msg
});

}

else if(Notification.permission!=="denied"){

Notification.requestPermission().then(permission=>{

if(permission==="granted"){

new Notification("แจ้งเตือน PM2.5",{body:msg});

}

})

}

}


getLocation();

</script>

</body>
</html>
